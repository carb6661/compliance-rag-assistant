[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "compliance-rag-assistant"
version = "0.2.0"
description = "Persistent, version-scoped compliance evidence retrieval and citation-verified RAG"
requires-python = ">=3.11"
dependencies = [
  "markdown-it-py>=4,<5",
  "langchain-core>=1,<2",
  "pydantic>=2.12,<3",
  "fastapi>=0.119,<1",
  "uvicorn>=0.37,<1",
  "httpx>=0.28,<0.29",
]

[project.scripts]
compliance-rag = "compliance_rag.__main__:main"

[tool.setuptools.packages.find]
include = ["compliance_rag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
